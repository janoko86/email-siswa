<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMPK 3 PENABUR - Portal Akun (Link CSV)</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0b3c5d;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      color: #0b3c5d;
      margin: 0 0 5px 0;
      text-align: center;
    }
    p.subtitle {
      color: #777;
      font-size: 14px;
      text-align: center;
      margin: 0 0 25px 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #328cc1;
      outline: none;
    }
    button {
      background-color: #328cc1;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d6f9a;
    }
    .result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info-grid {
      margin-top: 10px;
      border-bottom: 1px dashed rgba(0,0,0,0.1);
      padding-bottom: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .box {
      background: rgba(255, 255, 255, 0.8);
      padding: 8px;
      font-family: monospace;
      font-size: 15px;
      border-radius: 4px;
      margin-top: 4px;
      margin-bottom: 10px;
      word-break: break-all;
      border: 1px solid #b2dba1;
    }
    .loader {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #328cc1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 15px auto 0 auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <h2>SMPK 3 PENABUR</h2>
  <p class="subtitle">Sistem Informasi Akun Siswa</p>
  
  <div class="form-group">
    <label for="nisn">Masukan Kelas + No Absen</label>
    <input type="text" id="nisn" placeholder="Masukkan Kelas + No Absen Anda..." autocomplete="off">
  </div>
  
  <button id="btnCek" onclick="cariDataDariLinkCSV()">Cek Akun Saya</button>
  <div id="loader" class="loader"></div>
  
  <div id="result" class="result"></div>
</div>

<script>
  // GANTI teks di bawah ini dengan Link CSV hasil publikasi Google Sheets Anda
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vST0DxUCTCb1qu2ESEGPkqsoMiTqdsv6d2BzmLEnNaq99hx1xpEot0vxiCsdYTacAz-QK2vFQixvc-f/pubhtml?gid=0&single=true";

  async function cariDataDariLinkCSV() {
    const nisnInput = document.getElementById("nisn").value.trim();
    const resultDiv = document.getElementById("result");
    const loader = document.getElementById("loader");
    const btn = document.getElementById("btnCek");

    if (!nisnInput) {
      tampilkanPesan("Harap masukkan Kelas+No Absen terlebih dahulu.", "error");
      return;
    }

    loader.style.display = "block";
    resultDiv.style.display = "none";
    btn.disabled = true;

    try {
      const response = await fetch(CSV_URL);
      
      if (!response.ok) {
        throw new Error("Gagal mengunduh data dari link Spreadsheet.");
      }
      
      const textData = await response.text();
      const baris = textData.split(/\r?\n/);
      let siswaDitemukan = null;

      for (let i = 1; i < baris.length; i++) {
        if (baris[i].trim() === "") continue;
        
        const kolom = baris[i].split(',');
        const currentNisn = kolom[0].trim();

        if (currentNisn === nisnInput) {
          // Mengamankan pembacaan kolom agar tidak error jika kolom kosong/kurang
          siswaDitemukan = {
            nisn: kolom[0] ? kolom[0].trim() : "",
            nama: kolom[1] ? kolom[1].trim() : "",
            kelas: kolom[2] ? kolom[2].trim() : "",
            email: kolom[3] ? kolom[3].trim() : "",
            password: kolom[4] ? kolom[4].trim() : ""
          };
          break;
        }
      }

      if (siswaDitemukan) {
        // PERIKSA: Apakah Email DAN Password kosong?
        if (siswaDitemukan.email === "" && siswaDitemukan.password === "") {
          let htmlWarning = `
            <strong style="font-size: 16px; display:block;">Halo, ${siswaDitemukan.nama}!</strong>
            <div class="info-grid">
              <b>No Absen:</b> ${siswaDitemukan.nisn} <br>
              <b>Kelas:</b> ${siswaDitemukan.kelas}
            </div>
            <div style="font-weight: bold; margin-top: 10px; text-align: center;">
              ⚠️ Anda belum mempunyai Akun.
            </div>
            <small style="color: #666; display:block; margin-top:10px; text-align: center;">Silakan hubungi Wali Kelas atau Tim IT Sekolah.</small>
          `;
          tampilkanPesan(htmlWarning, "warning");
        } else {
          // Jika akun tersedia, tampilkan seperti biasa
          let htmlKonten = `
            <strong style="font-size: 16px; display:block;">Halo, ${siswaDitemukan.nama}!</strong>
            <div class="info-grid">
              <b>NISN:</b> ${siswaDitemukan.nisn} <br>
              <b>Kelas:</b> ${siswaDitemukan.kelas}
            </div>
            <div><b>Email Pembelajaran:</b></div>
            <div class="box">${siswaDitemukan.email}</div>
            <div><b>Password Sementara:</b></div>
            <div class="box">${siswaDitemukan.password}</div>
            <small style="color: #555; display:block; margin-top:10px;">*Demi keamanan, segera ubah password Anda setelah login berhasil.</small>
          `;
          tampilkanPesan(htmlKonten, "success");
        }
      } else {
        tampilkanPesan("No Absen tidak ditemukan. Pastikan nomor yang dimasukkan benar.", "error");
      }

    } catch (error) {
      console.error(error);
      tampilkanPesan("Gagal mengambil data dari Google Sheets. Pastikan link CSV valid dan spreadsheet sudah dipublikasikan.", "error");
    } finally {
      loader.style.display = "none";
      btn.disabled = false;
    }
  }

  function tampilkanPesan(pesan, tipe) {
    const resultDiv = document.getElementById("result");
    resultDiv.className = `result ${tipe}`;
    resultDiv.innerHTML = pesan;
    resultDiv.style.display = "block";
  }
</script>

</body>
</html>
